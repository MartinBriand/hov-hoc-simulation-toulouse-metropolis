main_directory = "output-synpop"

crs = "epsg:2154"

random_seed = 123454321

[simulation_area]
aav_name = "Toulouse"

[zones]
france = true

[survey]
[survey.mobisurvstd]
path = "../data/emc2-2023.zip"
[survey.characteristics]
restrict_to_simulation_area = true

[synthetic_population]
