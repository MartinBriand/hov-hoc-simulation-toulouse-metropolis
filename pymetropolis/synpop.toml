[population_characteristics]
restrict_to_survey_area = true

[plots]
width = "469.75pt"
latex = true
font = "serif"
fontsize = 10
format = "pdf"
colors = "Set2"
[plots.mode_colors]
car_driver = "#0072B2"
car_driver_with_passengers = "#CC79A7"
car_passenger = "#D55E00"
public_transit = "#E69F00"
walking = "#009E73"
bicycle = "#56B4E9"
